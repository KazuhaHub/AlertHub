name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Core gate: formatting, vet, build, and the full unit-test suite on the SQLite
  # (Starter tier) path — the one that must pass on every machine.
  go:
    name: Go build + test (sqlite)
    runs-on: ubuntu-latest
    needs: web-admin
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt (must be clean)
        run: |
          unformatted="$(gofmt -l server/)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-clean:"
            echo "$unformatted"
            gofmt -d server/
            exit 1
          fi

      - name: fetch the built admin assets
        uses: actions/download-artifact@v8
        with:
          name: webadmin-dist-assets
          path: server/internal/webadmin/dist/assets

      # A missing or empty assets/ makes the hashed-asset cache test skip
      # instead of fail, so assert the artifact really landed.
      - name: assert the admin assets are present (test must not silently skip)
        run: |
          if [ -z "$(ls -A server/internal/webadmin/dist/assets 2>/dev/null)" ]; then
            echo "::error::dist/assets is empty; the hashed-asset cache test would skip"
            exit 1
          fi

      - name: go vet
        run: go vet ./server/...

      - name: go build
        run: go build ./server/...

      - name: go test
        run: go test -count=1 ./server/...

  # Enterprise tier: re-runs the suite against real PostgreSQL so the gated
  # multi-tenant + Row-Level-Security tests actually execute (they skip without a
  # DSN). This is what proves the RLS wall stays live.
  postgres:
    name: Go test (postgres + RLS)
    runs-on: ubuntu-latest
    needs: web-admin
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: alerthub
          POSTGRES_PASSWORD: alerthub
          POSTGRES_DB: alerthub_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U alerthub"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: fetch the built admin assets
        uses: actions/download-artifact@v8
        with:
          name: webadmin-dist-assets
          path: server/internal/webadmin/dist/assets

      # A missing or empty assets/ makes the hashed-asset cache test skip
      # instead of fail, so assert the artifact really landed.
      - name: assert the admin assets are present (test must not silently skip)
        run: |
          if [ -z "$(ls -A server/internal/webadmin/dist/assets 2>/dev/null)" ]; then
            echo "::error::dist/assets is empty; the hashed-asset cache test would skip"
            exit 1
          fi

      - name: go test (Postgres-gated tests active)
        env:
          ALERTHUB_TEST_PG_DSN: postgres://alerthub:alerthub@localhost:5432/alerthub_test?sslmode=disable
        run: go test -count=1 ./server/...

      - name: assert the RLS tests actually ran (did not silently skip)
        env:
          ALERTHUB_TEST_PG_DSN: postgres://alerthub:alerthub@localhost:5432/alerthub_test?sslmode=disable
        run: |
          out="$(go test -count=1 -v -run TestPostgres ./server/internal/store/... ./server/internal/api/...)"
          echo "$out"
          echo "$out" | grep -q -- '--- PASS: TestPostgres_RLS_LiveViaBeginOrg' \
            || { echo "::error::RLS live test did not run"; exit 1; }
          echo "$out" | grep -q -- '--- PASS: TestPostgres_RLS_WriteCheck' \
            || { echo "::error::RLS write-check test did not run"; exit 1; }

  # Cross-language signing conformance: boots the real server and verifies a
  # Go-signed envelope with the SAME web/verify.js the browser client uses, so the
  # SPEC §3 canonical bytes stay byte-identical across Go and JS.
  conformance:
    name: Signing conformance (Go <-> JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Node 22+ has Ed25519 in WebCrypto, so verify.js uses the native path and
      # never needs its CDN fallback (keeps CI hermetic).
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: conformance
        run: ./scripts/conformance.sh

  # Supply-chain gate. This is not decorative: the first run of it found 9
  # advisories reaching this code — 7 stdlib (fixed by pinning the toolchain in
  # go.mod), golang.org/x/text (the NFC library on the signing path), and
  # goxmldsig (the library that VALIDATES SAML assertion signatures).
  vuln:
    name: Vulnerability scan (Go + npm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./server/...

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-admin/package-lock.json

      - name: npm audit
        working-directory: web-admin
        # Fail on anything moderate or worse. Low-severity noise in dev-only
        # tooling should not block a release, but anything reachable should.
        run: npm audit --audit-level=moderate

  # The admin SPA (Ant Design 6) must typecheck AND build. `npm run build` runs
  # `tsc -b && vite build`; the tsc step works now that tsconfig.app.json carries
  # the @/* path mapping that mirrors vite's alias.
  web-admin:
    name: Admin SPA typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-admin/package-lock.json

      - name: npm ci
        working-directory: web-admin
        run: npm ci

      - name: typecheck + build
        working-directory: web-admin
        run: npm run build

      # dist/index.html is committed and names content-hashed chunks, but
      # dist/assets/ is gitignored. The Go jobs therefore embed an index.html
      # pointing at files that are not in the checkout, which is what made
      # TestCachePolicy_HashedAssetsAreImmutable fail. Publish the assets here
      # so the Go jobs embed a dist/ that is internally consistent.
      - uses: actions/upload-artifact@v7
        with:
          name: webadmin-dist-assets
          path: server/internal/webadmin/dist/assets
          if-no-files-found: error
          retention-days: 1
